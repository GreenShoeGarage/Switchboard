services:
  switchboard:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      SWITCHBOARD_DATABASE_PATH: /data/switchboard.db
      SWITCHBOARD_MIGRATIONS_PATH: /opt/switchboard/drizzle
      SWITCHBOARD_TRUST_PROXY: "true"
    expose:
      - "3000"
    volumes:
      - switchboard-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      switchboard:
        condition: service_healthy
    environment:
      SWITCHBOARD_SITE_ADDRESS: ${SWITCHBOARD_SITE_ADDRESS:-http://localhost}
    ports:
      - "${SWITCHBOARD_HTTP_PORT:-80}:80"
      - "${SWITCHBOARD_HTTPS_PORT:-443}:443"
      - "${SWITCHBOARD_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  switchboard-data:
  caddy-data:
  caddy-config:
